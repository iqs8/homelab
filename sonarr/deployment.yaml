apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
spec:
  replicas: 1                       # SQLite: only ever one copy
  strategy:
    type: Recreate                  # old pod fully stops before the new one starts
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329   # pinned; upgrades only when you change this
          securityContext:
            appArmorProfile:
              type: Unconfined
          env:
            - name: PUID            # linuxserver images: run the app as this user...
              value: "1000"
            - name: PGID            # ...and group, so files match the HDD folders
              value: "1000"
            - name: TZ
              value: America/Toronto
          ports:
            - containerPort: 8989   # Sonarr's web UI
          resources:
            requests:
              cpu: 100m             # a tenth of a core; mostly idle
              memory: 256Mi
            limits:
              memory: 1Gi           # stops a runaway from eating the mini pc
          volumeMounts:
            - name: config
              mountPath: /config    # where linuxserver images keep settings + database
            - name: media-data
              mountPath: /data      # same path as Jellyfin, so the folders line up
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: media-data
          persistentVolumeClaim:
            claimName: media-claim  # the shared HDD PVC; this pins Sonarr to the mini pc