apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-storage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/iqs8/homelab
    targetRevision: HEAD
    path: monitoring-storage                 # watch this folder
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true