apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    # Where the chart comes from: a Helm chart repository, not your Git repo
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.1.0          # pinned version: upgrades only happen when you change this line
    helm:
      valuesObject:                 # our settings ("values"), written right here
        # --- k3s fixes: these parts are built into the k3s process, not separate pods,
        #     so the chart can't find them and would show them as permanently down
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false

                # --- Alertmanager: receives firing alerts from Prometheus and sends them to Discord
        alertmanager:
          enabled: true
          alertmanagerSpec:
            nodeSelector:
              kubernetes.io/hostname: hououin-kyouma   # always run on the mini pc, next to Prometheus, can't test node failures since stateful set would be on laptop
            secrets:
              - alertmanager-discord        # made by hand; mounted at /etc/alertmanager/secrets/alertmanager-discord/
          ingress:                          # Alertmanager's web page: see alerts, create silences
            enabled: true
            ingressClassName: traefik
            hosts:
              - alertmanager.home
            paths:
              - /
          config:
            route:
              receiver: discord             # default: everything goes to Discord...
              group_by: ['namespace', 'alertname']
              group_wait: 30s               # wait 30s after the first alert so related ones arrive in one message
              group_interval: 5m            # new alerts in an existing group: send at most every 5 min
              repeat_interval: 12h          # still firing? remind every 12 hours
              routes:
                - receiver: 'null'          # ...except Watchdog, which fires forever on purpose
                  matchers:
                    - alertname = "Watchdog"
            receivers:
              - name: 'null'                # a receiver with no destination = "throw away"
              - name: discord
                discord_configs:
                  - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
                    send_resolved: true     # also post when an alert stops firing

        # --- kube-state-metrics: most alert rules need its data, so keep it on the mini pc too
        kube-state-metrics:
          nodeSelector:
            kubernetes.io/hostname: hououin-kyouma

        # --- Prometheus
        prometheus:
          prometheusSpec:
            retention: 30d          # delete data older than 30 days...
            retentionSize: 40GB     # ...or once the database passes 40 GB, whichever comes first
            storageSpec:
              volumeClaimTemplate:  # the PVC description; the operator makes the real PVC from it
                spec:
                  storageClassName: local-hdd   # ← the link to our PV
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 50Gi
          ingress:                  # Prometheus's own web page, handy for checking it works
            enabled: true
            ingressClassName: traefik
            hosts:
              - prometheus.home
            paths:
              - /

        # --- Grafana (no storage: the chart's default, so nothing to set for that)
        grafana:
          admin:
            existingSecret: grafana-admin   # the Secret from Part A
          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - grafana.home
            path: /
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true        # needed: the chart's CRDs are too big for Argo's normal apply