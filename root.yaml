apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/iqs8/homelab.git
    targetRevision: main
    path: apps                 # ← the only real difference: watch apps/
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true              # file removed from apps/ → that sync job is removed
      selfHeal: true
